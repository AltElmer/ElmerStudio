name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: elmer
            elmer_version: "9.0"
            skip_budget: "5"
          - os: ubuntu-24.04
            backend: openfoam
            openfoam_version: "v2606"
            skip_budget: "0"
          - os: windows-latest
            backend: elmer
            elmer_version: "9.0"
            skip_budget: "10"
          - os: macos-latest
            backend: elmer
            elmer_version: "9.0"
            skip_budget: "10"
    env:
      PYTHONUNBUFFERED: "1"
      ELMERSTUDIO_SKIP_BUDGET: ${{ matrix.skip_budget }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Linux system libraries and Elmer (official CSC PPA)
        if: runner.os == 'Linux' && matrix.backend == 'elmer'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglu1-mesa libegl1 libgl1-mesa-dri \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-shape0 libxcb-randr0 libxcursor1 libxft2 libxinerama1 libfontconfig1 libdbus-1-3 \
            software-properties-common
          sudo add-apt-repository -y ppa:elmer-csc-ubuntu/elmer-csc-ppa
          sudo apt-get update
          sudo apt-get install -y elmerfem-csc
          (command -v ElmerSolver || command -v ElmerSolver_mpi) && ElmerGrid 2>&1 | head -n 3 || true

      - name: Linux system libraries and OpenFOAM v2606
        if: runner.os == 'Linux' && matrix.backend == 'openfoam'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglu1-mesa libegl1 libgl1-mesa-dri \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-shape0 libxcb-randr0 libxcursor1 libxft2 libxinerama1 libfontconfig1 libdbus-1-3 \
            gnupg2
          sudo sh -c "echo 'deb http://dl.openfoam.org/ubuntu $(lsb_release -cs) main' > /etc/apt/sources.list.d/openfoam.list"
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 9E3E4B4B
          sudo apt-get update
          sudo apt-get install -y openfoam2606
          source /usr/lib/openfoam/openfoam2606/etc/bashrc && foamVersion
          echo "OPENFOAM_ROOT=/usr/lib/openfoam/openfoam2606" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Engine and solver tests (Linux, with Elmer)
        if: runner.os == 'Linux' && matrix.backend == 'elmer'
        env:
          ELMERSTUDIO_TEST_MPI_HOME: /usr      # the PPA's Elmer is an MPI build: one study also runs on 2 processes
        run: |
          ElmerSolver -v 2>&1 | head -n 8 || true
          command -v mpiexec || echo "no mpiexec: the MPI test will fail with the reason"
          xvfb-run -a pytest tests -v -rs

      - name: Engine and solver tests (Linux, with OpenFOAM)
        if: runner.os == 'Linux' && matrix.backend == 'openfoam'
        env:
          OPENFOAM_ROOT: /usr/lib/openfoam/openfoam2606
        run: |
          source /usr/lib/openfoam/openfoam2606/etc/bashrc && foamVersion
          xvfb-run -a pytest tests -v -rs

      - name: Engine tests (no Elmer on this runner; solver tests skip)
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -v -rs

      - name: Keep failed solver cases (SIF, mesh, solver.log)
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: failed-cases-linux
          path: |
            /tmp/es_*/
            /tmp/elmerstudio_tests_*/
          retention-days: 7
          if-no-files-found: ignore

      - name: GUI smoke test (drives the main window; Linux, software OpenGL)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/test_gui_smoke.py
