[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "elmerstudio"
version = "1.0.0"
description = "Model-builder desktop (geometry, physics, mesh, study, results) for the Elmer FEM multiphysics solver"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
dependencies = [
    "PySide6>=6.5",
    "vtk>=9.2",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "gmsh>=4.11",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "psutil>=5.9",
]

[project.gui-scripts]
elmerstudio = "elmerstudio.app:main"

[tool.setuptools.packages.find]
include = ["elmerstudio*"]
